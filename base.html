<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FitBuddy AI{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<header class="navbar">
    <div class="nav-container">
        <a href="/" class="logo">💪 FitBuddy AI</a>
        <nav>
            <a href="/">Home</a>
            <a href="/view-all-users">Admin Dashboard</a>
        </nav>
    </div>
</header>

<main class="page-container">
    {% block content %}{% endblock %}
</main>

<footer class="footer">
    <p>FitBuddy AI · Personalized Fitness Planning</p>
    <p class="footer-note">AI-generated fitness information is for general wellness purposes and is not a substitute for professional medical advice.</p>
</footer>
</body>
</html>
